<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar presença - Anayad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --rosa-escuro: #7b1e4f;
      --rosa-profundo: #5d1239;
      --rosa-medio: #a84373;
      --rosa-suave: #f3e2eb;
      --papel: #fdfbf7; /* Creme aveludado idêntico à capa */
      --texto: #4a1c31;
      --branco-botao: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Montserrat", sans-serif;
      color: var(--texto);
      
      /* Mesmo gradiente de fundo sofisticado da capa */
      background: linear-gradient(
        135deg,
        #f5ebe6 0%,
        #ebd4df 50%,
        #dfb8ca 100%
      );
      background-attachment: fixed;
    }

    .pagina-confirmacao {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .cartao-confirmacao {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      padding: 58px 38px 40px;
      text-align: center;
      background: var(--papel);
      border: 1px solid rgba(123, 30, 79, 0.18);
      border-radius: 180px 180px 24px 24px;
      box-shadow: 0 25px 50px rgba(74, 28, 49, 0.15);
    }

    /* Moldura interna elegante */
    .cartao-confirmacao::before {
      content: "";
      position: absolute;
      inset: 11px;
      z-index: -1;
      border: 1px solid rgba(123, 30, 79, 0.22);
      border-radius: 170px 170px 16px 16px;
      pointer-events: none;
    }

    .conteudo {
      position: relative;
      z-index: 1;
    }

    .estrelas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--rosa-medio);
    }

    .estrela-pequena { font-size: 0.9rem; }
    .estrela-grande { font-size: 1.8rem; line-height: 1; }

    h1 {
      max-width: 420px;
      margin: 0 auto;
      color: var(--rosa-escuro);
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.5rem, 9vw, 3.8rem);
      font-weight: 700;
      line-height: 1;
    }

    .descricao {
      max-width: 360px;
      margin: 14px auto 30px;
      color: var(--texto);
      font-size: 0.82rem;
      line-height: 1.7;
    }

    .campo {
      margin-bottom: 19px;
      text-align: left;
    }

    .campo label,
    .pergunta {
      display: block;
      margin-bottom: 8px;
      color: var(--rosa-profundo);
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .campo input,
    .campo select {
      width: 100%;
      max-width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      color: var(--texto);
      background: #ffffff;
      border: 1px solid rgba(123, 30, 79, 0.25);
      border-radius: 8px;
      outline: none;
      font-family: "Montserrat", sans-serif;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: var(--rosa-escuro);
      box-shadow: 0 0 0 3px rgba(123, 30, 79, 0.12);
    }

    .opcoes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .opcao {
      position: relative;
      min-width: 0;
    }

    .opcao input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .opcao label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 12px 10px;
      color: var(--rosa-escuro);
      background: transparent;
      border: 1px solid rgba(123, 30, 79, 0.35);
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .opcao label:hover {
      background: rgba(123, 30, 79, 0.06);
      transform: translateY(-1px);
    }

    .opcao input:checked + label {
      color: var(--branco-botao);
      background: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
      box-shadow: 0 4px 10px rgba(123, 30, 79, 0.2);
    }

    .area-acompanhantes {
      display: none;
      margin-bottom: 19px;
      padding: 18px;
      text-align: left;
      background: #f7f1eb;
      border: 1px solid rgba(123, 30, 79, 0.18);
      border-radius: 8px;
    }

    .area-acompanhantes.ativo {
      display: block;
      animation: aparecer 0.25s ease;
    }

    .area-acompanhantes .campo {
      margin-bottom: 0;
    }


    .quantidades {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .quantidade-opcao {
      min-width: 0;
      min-height: 76px;
      padding: 10px 4px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: var(--rosa-escuro);
      background: #ffffff;

      border: 1px solid rgba(123, 30, 79, 0.22);
      border-radius: 14px;

      font-family: "Montserrat", sans-serif;
      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .quantidade-opcao:hover {
      transform: translateY(-2px);
      border-color: rgba(123, 30, 79, 0.45);
      box-shadow: 0 6px 14px rgba(123, 30, 79, 0.10);
    }

    .quantidade-opcao.ativa {
      color: #ffffff;
      background: linear-gradient(
        145deg,
        var(--rosa-medio),
        var(--rosa-escuro)
      );
      border-color: var(--rosa-escuro);
      box-shadow: 0 8px 18px rgba(123, 30, 79, 0.22);
      transform: translateY(-2px);
    }

    .quantidade-valor {
      font-family: "Cormorant Garamond", serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 0.9;
    }

    .quantidade-texto {
      margin-top: 7px;
      font-size: 0.56rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .aviso {
      margin-top: 8px;
      color: var(--rosa-medio);
      font-size: 0.68rem;
      line-height: 1.5;
    }

    .botao-enviar,
    .botao-voltar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 13px 20px;
      border-radius: 50px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .botao-enviar {
      color: var(--branco-botao);
      background: var(--rosa-escuro);
      border: 1px solid var(--rosa-escuro);
      box-shadow: 0 4px 12px rgba(123, 30, 79, 0.25);
    }

    .botao-enviar:hover {
      background: var(--rosa-profundo);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(123, 30, 79, 0.35);
    }

    .botao-voltar {
      margin-top: 11px;
      color: var(--rosa-escuro);
      background: transparent;
      border: 1px solid rgba(123, 30, 79, 0.4);
    }

    .botao-voltar:hover {
      background: rgba(123, 30, 79, 0.06);
      transform: translateY(-1px);
    }

    .mensagem {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.6;
      text-align: center;
    }

    .mensagem.sucesso {
      display: block;
      color: var(--rosa-profundo);
      background: #f3e2eb;
      border: 1px solid rgba(123, 30, 79, 0.25);
    }

    .mensagem.erro {
      display: block;
      color: #8b1f42;
      background: rgba(255, 226, 233, 0.85);
      border: 1px solid rgba(139, 31, 66, 0.3);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .cartao-confirmacao {
        padding: 54px 20px 30px;
        border-radius: 160px 160px 20px 20px;
      }

      .cartao-confirmacao::before {
        inset: 8px;
        border-radius: 150px 150px 12px 12px;
      }

      h1 {
        font-size: clamp(2.2rem, 11vw, 3rem);
      }

      .opcoes {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .quantidades {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
      }

      .quantidade-opcao {
        min-height: 68px;
        padding: 8px 2px;
        border-radius: 11px;
      }

      .quantidade-valor {
        font-size: 1.7rem;
      }

      .quantidade-texto {
        margin-top: 6px;
        font-size: 0.48rem;
      }
    }
  </style>
</head>

<body>
  <main class="pagina-confirmacao">
    <section class="cartao-confirmacao">
      <div class="conteudo">

        <div class="estrelas" aria-hidden="true">
          <span class="estrela-pequena">✦</span>
          <span class="estrela-grande">✷</span>
          <span class="estrela-pequena">✦</span>
        </div>

        <h1>
          Confirme sua presença
        </h1>

        <p class="descricao">
          Informe se você estará presente no aniversário da
          Anayad e se levará acompanhantes.
        </p>

        <form id="formConfirmacao">

          <div class="campo">
            <label for="nomeConvidado">
              Seu nome completo
            </label>

            <input
              type="text"
              id="nomeConvidado"
              name="nomeConvidado"
              maxlength="100"
              placeholder="Digite seu nome"
              autocomplete="name"
              required
            >
          </div>

          <div class="campo">
            <span class="pergunta">
              Você irá ao aniversário?
            </span>

            <div class="opcoes">

              <div class="opcao">
                <input
                  type="radio"
                  id="presencaSim"
                  name="presenca"
                  value="sim"
                  required
                >

                <label for="presencaSim">
                  Sim, estarei presente
                </label>
              </div>

              <div class="opcao">
                <input
                  type="radio"
                  id="presencaNao"
                  name="presenca"
                  value="nao"
                  required
                >

                <label for="presencaNao">
                  Não poderei comparecer
                </label>
              </div>

            </div>
          </div>

          <div
            class="area-acompanhantes"
            id="areaAcompanhantes"
          >
            <div class="campo">
              <label for="quantidadeAcompanhantes">
                Quantos acompanhantes você levará?
              </label>

              <div
                class="quantidades"
                role="radiogroup"
                aria-label="Quantidade de acompanhantes"
              >
                <button
                  type="button"
                  class="quantidade-opcao ativa"
                  data-quantidade="0"
                  aria-pressed="true"
                >
                  <span class="quantidade-valor">0</span>
                  <span class="quantidade-texto">Nenhum</span>
                </button>

                <button
                  type="button"
                  class="quantidade-opcao"
                  data-quantidade="1"
                  aria-pressed="false"
                >
                  <span class="quantidade-valor">1</span>
                  <span class="quantidade-texto">Pessoa</span>
                </button>

                <button
                  type="button"
                  class="quantidade-opcao"
                  data-quantidade="2"
                  aria-pressed="false"
                >
                  <span class="quantidade-valor">2</span>
                  <span class="quantidade-texto">Pessoas</span>
                </button>

                <button
                  type="button"
                  class="quantidade-opcao"
                  data-quantidade="3"
                  aria-pressed="false"
                >
                  <span class="quantidade-valor">3</span>
                  <span class="quantidade-texto">Pessoas</span>
                </button>

                <button
                  type="button"
                  class="quantidade-opcao"
                  data-quantidade="4"
                  aria-pressed="false"
                >
                  <span class="quantidade-valor">4</span>
                  <span class="quantidade-texto">Pessoas</span>
                </button>
              </div>

              <input
                type="hidden"
                id="quantidadeAcompanhantes"
                name="quantidadeAcompanhantes"
                value="0"
              >

              <p class="aviso">
                Limite máximo de 4 acompanhantes por convidado.
              </p>
            </div>
          </div>

          <button
            type="submit"
            class="botao-enviar"
          >
            Enviar confirmação
          </button>

          <a
            href="index.html"
            class="botao-voltar"
          >
            Voltar para o convite
          </a>

          <p
            id="mensagemConfirmacao"
            class="mensagem"
            aria-live="polite"
          ></p>

        </form>
      </div>
    </section>
  </main>

  <script>
    const formulario = document.getElementById("formConfirmacao");
    const presencaSim = document.getElementById("presencaSim");
    const presencaNao = document.getElementById("presencaNao");
    const areaAcompanhantes = document.getElementById("areaAcompanhantes");
    const quantidadeAcompanhantes = document.getElementById("quantidadeAcompanhantes");
    const opcoesQuantidade = document.querySelectorAll(".quantidade-opcao");
    const mensagem = document.getElementById("mensagemConfirmacao");

    opcoesQuantidade.forEach(function (botao) {
      botao.addEventListener("click", function () {
        const valor = botao.dataset.quantidade;

        quantidadeAcompanhantes.value = valor;

        opcoesQuantidade.forEach(function (opcao) {
          const selecionada = opcao === botao;

          opcao.classList.toggle("ativa", selecionada);
          opcao.setAttribute(
            "aria-pressed",
            selecionada ? "true" : "false"
          );
        });
      });
    });

    presencaSim.addEventListener("change", function () {
      if (presencaSim.checked) {
        areaAcompanhantes.classList.add("ativo");
      }
    });

    presencaNao.addEventListener("change", function () {
      if (presencaNao.checked) {
        areaAcompanhantes.classList.remove("ativo");
        quantidadeAcompanhantes.value = "0";

        opcoesQuantidade.forEach(function (opcao) {
          const selecionada = opcao.dataset.quantidade === "0";

          opcao.classList.toggle("ativa", selecionada);
          opcao.setAttribute(
            "aria-pressed",
            selecionada ? "true" : "false"
          );
        });
      }
    });

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();

      mensagem.textContent = "";
      mensagem.className = "mensagem";

      const nome = document
        .getElementById("nomeConvidado")
        .value
        .trim();

      const presencaSelecionada = document.querySelector(
        'input[name="presenca"]:checked'
      );

      if (nome.length < 2) {
        exibirMensagem(
          "Digite seu nome para continuar.",
          "erro"
        );
        return;
      }

      if (!presencaSelecionada) {
        exibirMensagem(
          "Informe se você irá ao aniversário.",
          "erro"
        );
        return;
      }

      const resposta = presencaSelecionada.value;

      const acompanhantes =
        resposta === "sim"
          ? Number(quantidadeAcompanhantes.value)
          : 0;

      if (
        Number.isNaN(acompanhantes) ||
        acompanhantes < 0 ||
        acompanhantes > 4
      ) {
        exibirMensagem(
          "O limite é de 4 acompanhantes.",
          "erro"
        );
        return;
      }

      if (resposta === "sim") {
        let complemento = "";

        if (acompanhantes === 0) {
          complemento = " Você informou que não levará acompanhantes.";
        } else if (acompanhantes === 1) {
          complemento = " Você levará 1 acompanhante.";
        } else {
          complemento = ` Você levará ${acompanhantes} acompanhantes.`;
        }

        exibirMensagem(
          `Obrigada, ${nome}! Sua presença foi confirmada.${complemento}`,
          "sucesso"
        );
      } else {
        exibirMensagem(
          `Obrigada por responder, ${nome}. Sentiremos sua falta!`,
          "sucesso"
        );
      }
    });

    function exibirMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `mensagem ${tipo}`;
    }
  </script>
</body>
</html>
